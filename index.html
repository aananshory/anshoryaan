
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Aritmatika</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 850px;
            margin-top: 80px;
            margin-bottom: 50px;
        }

        .card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .header {
            background-color: #0d6efd;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .header h4 {
            color: #5c9bd1;
            background-color: white;
            display: inline-block;
            padding: 3px 5px;
            font-size: 23px;
        }

        .card-body {
            padding: 40px;
        }

        .form-label {
            font-size: 23px;
            margin-bottom: 12px;
        }

        .form-control, .form-select {
            height: 60px;
            font-size: 22px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .btn-hitung {
            height: 60px;
            font-size: 24px;
            width: 100%;
            margin-top: 0;
        }

        .hasil {
            background-color: #212529;
            color: white;
            text-align: center;
            border-radius: 10px;
            padding: 25px;
            margin-top: 40px;
        }

        .hasil h4 {
            font-size: 22px;
        }

        .hasil h1 {
            font-size: 85px;
            font-weight: bold;
            margin: 10px 0;
        }

        @media (max-width: 576px) {
            .container {
                margin-top: 30px;
            }

            .card-body {
                padding: 20px;
            }

            .header h1 {
                font-size: 30px;
            }

            .header h4 {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <!-- Header -->
        <div class="header">
            <h1>Kalkulator Aritmatika</h1>
            <h4>Aan Abdurrahman Anshory - NIM. 262302007</h4>
        </div>

        <!-- Form Kalkulator -->
        <div class="card-body">

            <label class="form-label">Angka Pertama</label>
            <input type="number" id="angka1" class="form-control"
                   placeholder="Masukkan angka pertama">

            <label class="form-label">Angka Kedua</label>
            <input type="number" id="angka2" class="form-control"
                   placeholder="Masukkan angka kedua">

            <label class="form-label">Pilih Operator</label>
            <select id="operator" class="form-select">
                <option value="+">Penjumlahan (+)</option>
                <option value="-">Pengurangan (-)</option>
                <option value="*">Perkalian (*)</option>
                <option value="/">Pembagian (/)</option>
                <option value="**">Pangkat (**)</option>
                <option value="%">Modulus (%)</option>
            </select>

            <!-- Tombol Hitung -->
            <button onclick="hitung()" class="btn btn-primary btn-hitung">
                Hitung
            </button>

            <!-- Hasil -->
            <div class="hasil">
                <h4>HASIL PERHITUNGAN</h4>
                <h1 id="hasil">0</h1>
            </div>

        </div>
    </div>
</div>

<!-- JavaScript -->
<script>
    function hitung() {

        let angka1 = parseFloat(document.getElementById("angka1").value);
        let angka2 = parseFloat(document.getElementById("angka2").value);
        let operator = document.getElementById("operator").value;

        let hasil;

        if (isNaN(angka1) || isNaN(angka2)) {
            alert("Silakan masukkan kedua angka terlebih dahulu!");
            return;
        }

        switch (operator) {

            case "+":
                hasil = angka1 + angka2;
                break;

            case "-":
                hasil = angka1 - angka2;
                break;

            case "*":
                hasil = angka1 * angka2;
                break;

            case "/":
                if (angka2 === 0) {
                    alert("Angka tidak bisa dibagi dengan nol!");
                    return;
                }
                hasil = angka1 / angka2;
                break;

            case "**":
                hasil = angka1 ** angka2;
                break;

            case "%":
                if (angka2 === 0) {
                    alert("Modulus dengan nol tidak diperbolehkan!");
                    return;
                }
                hasil = angka1 % angka2;
                break;

            default:
                hasil = 0;
        }

        document.getElementById("hasil").innerText = hasil;
    }
</script>

</body>
  </html>
